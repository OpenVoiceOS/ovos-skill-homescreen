name: Ovoscope End-to-End Tests
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    secrets: inherit
    with:
      install_extras: 'test'
      test_path: 'test/end2end/'
